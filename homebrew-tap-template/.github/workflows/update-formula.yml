name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "VERSION=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT

      - name: Download checksums
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/lhwzds/restflow/releases/download/cli-v${{ steps.version.outputs.VERSION }}/checksums.txt" -o checksums.txt
          cat checksums.txt

      - name: Extract SHA256 hashes
        id: sha
        run: |
          set -euo pipefail

          extract_sha() {
            local filename="$1"
            local matches count sha
            matches="$(awk -v file="$filename" '$2 == file { print $1 }' checksums.txt)"
            count="$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$count" -ne 1 ]; then
              echo "Expected exactly one checksum for $filename, found $count" >&2
              exit 1
            fi
            sha="$(printf '%s\n' "$matches" | sed '/^$/d')"
            if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid sha256 for $filename: $sha" >&2
              exit 1
            fi
            printf '%s' "$sha"
          }

          ARM_MAC="$(extract_sha 'restflow-aarch64-apple-darwin.tar.gz')"
          X86_MAC="$(extract_sha 'restflow-x86_64-apple-darwin.tar.gz')"
          ARM_LINUX="$(extract_sha 'restflow-aarch64-unknown-linux-gnu.tar.gz')"
          X86_LINUX="$(extract_sha 'restflow-x86_64-unknown-linux-gnu.tar.gz')"
          echo "ARM_MAC=$ARM_MAC" >> $GITHUB_OUTPUT
          echo "X86_MAC=$X86_MAC" >> $GITHUB_OUTPUT
          echo "ARM_LINUX=$ARM_LINUX" >> $GITHUB_OUTPUT
          echo "X86_LINUX=$X86_LINUX" >> $GITHUB_OUTPUT

      - name: Update formula
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          ARM_MAC="${{ steps.sha.outputs.ARM_MAC }}"
          X86_MAC="${{ steps.sha.outputs.X86_MAC }}"
          ARM_LINUX="${{ steps.sha.outputs.ARM_LINUX }}"
          X86_LINUX="${{ steps.sha.outputs.X86_LINUX }}"
          for value in "$VERSION" "$ARM_MAC" "$X86_MAC" "$ARM_LINUX" "$X86_LINUX"; do
            test -n "$value"
          done

          cat > Formula/restflow.rb << EOF
          class Restflow < Formula
            desc "AI assistant that can execute workflows"
            homepage "https://github.com/lhwzds/restflow"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/lhwzds/restflow/releases/download/cli-v#{version}/restflow-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM_MAC}"
              else
                url "https://github.com/lhwzds/restflow/releases/download/cli-v#{version}/restflow-x86_64-apple-darwin.tar.gz"
                sha256 "${X86_MAC}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/lhwzds/restflow/releases/download/cli-v#{version}/restflow-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${ARM_LINUX}"
              else
                url "https://github.com/lhwzds/restflow/releases/download/cli-v#{version}/restflow-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${X86_LINUX}"
              end
            end

            def install
              bin.install "restflow"
              bin.install_symlink "restflow" => "rf"
            end

            test do
              assert_match "restflow #{version}", shell_output("#{bin}/restflow --version")
              assert_match "restflow #{version}", shell_output("#{bin}/rf --version")
            end
          end
          EOF

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Validate formula
        run: |
          set -euo pipefail
          brew audit --strict --online Formula/restflow.rb
          brew install --build-from-source Formula/restflow.rb
          brew test restflow

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/restflow.rb
          if git diff --cached --quiet; then
            echo "No formula changes detected."
            exit 0
          fi
          git commit -m "Update restflow to ${{ steps.version.outputs.VERSION }}"
          git push
