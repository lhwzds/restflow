[workspace]
members = [
    "crates/types",
    "crates/llm",
    "crates/agent",
    "crates/tools",
    "crates/core",
    "crates/runner",
    "crates/daemon",
    "crates/tui",
    "crates/cli",
]
resolver = "2"

# Default to running core
default-members = ["crates/core"]

[workspace.package]
version = "0.5.0"
authors = ["RestFlow Team"]
edition = "2024"

[workspace.dependencies]
types = { path = "crates/types" }
llm = { path = "crates/llm" }
agent = { path = "crates/agent" }
tools = { path = "crates/tools" }
restflow-core = { path = "crates/core" }
runner = { path = "crates/runner" }
daemon = { path = "crates/daemon" }
tui = { path = "crates/tui" }
monty = { git = "https://github.com/pydantic/monty", tag = "v0.0.7" }
anyhow = "1.0.101"
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.142"
fs2 = "0.4"
skrun = "0.1.1"
toml = "0.9"
tokio = { version = "1.51.1", features = ["full"] }
uuid = { version = "1.21.0", features = ["v4", "serde"] }
chrono = "0.4.44"
tracing = "0.1"

[profile.release]
# Optimize release builds
lto = true
opt-level = "z"
codegen-units = 1
strip = "debuginfo"
