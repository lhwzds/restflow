[workspace]
members = [
    "crates/restflow",
    "crates/agent",
    "crates/auth",
    "crates/chat",
    "crates/event",
    "crates/model",
    "crates/run",
    "crates/skill",
    "crates/store",
    "crates/tool",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
agent = { path = "crates/agent" }
auth = { path = "crates/auth" }
chat = { path = "crates/chat" }
event = { path = "crates/event" }
model = { path = "crates/model" }
run = { path = "crates/run" }
skill = { path = "crates/skill" }
store = { path = "crates/store" }
tool = { path = "crates/tool" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
