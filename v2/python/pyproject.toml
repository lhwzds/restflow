[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "restflow"
version = "0.1.0"
description = "Prototype Python API for the RestFlow V2 core"
requires-python = ">=3.11"

[tool.maturin]
bindings = "pyo3"
features = ["python-module"]
manifest-path = "../crates/py/Cargo.toml"
module-name = "restflow_native"
python-source = "."
