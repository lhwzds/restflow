[package]
name = "runner"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "runner"
path = "src/lib.rs"

[features]
default = []
test-utils = []

[dependencies]
# Internal dependencies
types = { workspace = true, features = ["specta"] }
agent = { workspace = true }
tools = { workspace = true }
restflow-core = { workspace = true }

# External dependencies
anyhow = "1.0.101"
async-trait = "0.1.89"
hex = "0.4.3"
parking_lot = "0.12"
regex = "1.11.1"
reqwest = { version = "0.13.2", features = ["form", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.142"
specta = { version = "=2.0.0-rc.23", features = ["derive", "chrono", "uuid", "serde_json"] }
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.21.0", features = ["v4", "serde"] }

[dev-dependencies]
agent = { workspace = true, features = ["test-utils"] }
restflow-core = { workspace = true, features = ["test-utils"] }
skrun = { workspace = true }
tempfile = "3.25.0"
