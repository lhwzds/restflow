[package]
name = "agent"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Rust-powered AI Agent framework with ReAct loop"
publish = false

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
types.workspace = true
llm = { workspace = true }

# AI-specific dependencies
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
futures = "0.3"
reqwest = { version = "0.13.2", features = ["json", "stream", "multipart"] }
dashmap = "6.1.0"
dirs = "6.0.0"

[features]
default = []
test-utils = ["llm/test-utils"]

[lints.rust]

[dev-dependencies]
llm = { workspace = true, features = ["test-utils"] }
tempfile = "3.25"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
