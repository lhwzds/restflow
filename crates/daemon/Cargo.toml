[package]
name = "daemon"
version.workspace = true
edition.workspace = true

[lib]
name = "daemon"
path = "src/lib.rs"

[features]
default = []
test-utils = []

[dependencies]
# Internal dependencies
types = { workspace = true, features = ["specta"] }
agent = { workspace = true }
tools = { workspace = true }
restflow-core = { workspace = true }
runner = { workspace = true }

# External dependencies
anyhow = "1.0.101"
async-trait = "0.1.89"
chrono = "0.4.44"
dirs = "6.0.0"
bytes = "1.10"
http = "1.3"
url = "2.5"
reqwest = { version = "0.13.2", features = ["form", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.142"
tempfile = "3.25.0"
thiserror = "2.0.17"
tokio = { version = "1.51.1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.21.0", features = ["v4", "serde"] }

[dev-dependencies]
agent = { workspace = true, features = ["test-utils"] }
restflow-core = { workspace = true, features = ["test-utils"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }
