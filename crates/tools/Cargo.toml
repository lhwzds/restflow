[package]
name = "tools"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Unified tool and skill system for RestFlow"

[dependencies]
# Core
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
skrun = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = "2.0"
anyhow = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Crate dependencies
types = { workspace = true, features = ["http-client"] }

# Tool implementations
regex = "1.11"
url = "2.5"
glob-match = "0.2"
async-recursion = "1.1"
sha2 = "0.10.9"
hex = "0.4"
once_cell = "1.20"
dashmap = "6.1.0"
dirs = "6.0.0"
postcard = { version = "1.1.3", features = ["use-std"] }
parking_lot = "0.12"
futures = "0.3"

# Unix-specific
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[features]
default = []

[lints.rust]


[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full"] }
redb = "3.1"
ai = { workspace = true, features = ["test-utils"] }
