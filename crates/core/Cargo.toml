[package]
name = "restflow-core"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "restflow_core"
path = "src/lib.rs"

[features]
default = []
test-utils = []

[dependencies]
# Internal dependencies
types = { workspace = true, features = ["specta"] }

# External dependencies
aes-gcm = "0.10"
anyhow = "1.0.101"
base64 = "0.22"
chrono = "0.4.44"
dirs = "6.0.0"
fs2 = { workspace = true }
hex = "0.4.3"
rand = "0.10"
redb = "3.1.0"
regex = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.142"
serde_yaml = "0.9"
skrun = { workspace = true }
specta = { version = "=2.0.0-rc.23", features = ["derive", "chrono", "uuid", "serde_json"] }
tempfile = "3.25.0"
tokio = { version = "1.51.1", features = ["full"] }
toml = "1.1"
tracing = "0.1"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
walkdir = "2"

[dev-dependencies]
filetime = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
