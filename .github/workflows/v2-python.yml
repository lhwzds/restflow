name: V2 Python Package

on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2-python.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: /tmp/restflow-v2-python-target
  PYTHON_VENV: /tmp/restflow-v2-python-venv
  WHEEL_DIR: /tmp/restflow-v2-python-dist

jobs:
  package:
    name: Build and smoke-test Python package
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/restflow-v2-python-target
          key: ${{ runner.os }}-v2-python-cargo-${{ hashFiles('v2/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-v2-python-cargo-

      - name: Create Python build environment
        run: |
          python -m venv "$PYTHON_VENV"
          "$PYTHON_VENV/bin/python" -m pip install --upgrade pip
          "$PYTHON_VENV/bin/python" -m pip install maturin

      - name: Run Python contract tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 "$PYTHON_VENV/bin/python" -m unittest discover -s v2/python/tests

      - name: Run Rust checks for native bridge
        run: |
          cargo test --manifest-path v2/Cargo.toml -p restflow-native --features python-module
          cargo clippy --manifest-path v2/Cargo.toml -p restflow-native --features python-module --all-targets -- -D warnings

      - name: Install package in editable mode
        run: |
          "$PYTHON_VENV/bin/python" v2/python/scripts/package.py develop \
            --target-dir "$CARGO_TARGET_DIR"

      - name: Smoke-test installed native package
        run: |
          "$PYTHON_VENV/bin/python" v2/python/scripts/package.py smoke

      - name: Build wheel
        run: |
          "$PYTHON_VENV/bin/python" v2/python/scripts/package.py build \
            --target-dir "$CARGO_TARGET_DIR" \
            --dist-dir "$WHEEL_DIR"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: restflow-v2-python-wheel
          path: /tmp/restflow-v2-python-dist/*.whl
          if-no-files-found: error
