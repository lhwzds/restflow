name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse origin/main)"

          if [ "$RELEASE_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Release tags must point at the latest origin/main commit."
            echo "::error::Release SHA: $RELEASE_SHA"
            echo "::error::origin/main SHA: $MAIN_SHA"
            exit 1
          fi

          TEST_RUN="$(gh run list \
            --workflow Tests \
            --branch main \
            --commit "$RELEASE_SHA" \
            --event push \
            --limit 1 \
            --json status,conclusion,url \
            --jq 'if length == 0 then "" else .[0] | [.status, .conclusion, .url] | @tsv end')"

          if [ -z "$TEST_RUN" ]; then
            echo "::error::No Tests workflow run found for $RELEASE_SHA on main."
            exit 1
          fi

          IFS=$'\t' read -r TEST_STATUS TEST_CONCLUSION TEST_URL <<< "$TEST_RUN"

          if [ "$TEST_STATUS" != "completed" ] || [ "$TEST_CONCLUSION" != "success" ]; then
            echo "::error::Release requires a completed successful Tests workflow on main."
            echo "::error::Tests status: $TEST_STATUS"
            echo "::error::Tests conclusion: $TEST_CONCLUSION"
            echo "::error::Tests URL: $TEST_URL"
            exit 1
          fi

          echo "Release source verified: $RELEASE_SHA is latest green main."

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Run release lint checks
        run: make lint

      - name: Run security audit
        run: make audit

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev

      - name: Build
        run: cargo build --release --package restflow-cli --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          ln -sfn restflow rf
          tar -czvf restflow-${{ matrix.target }}.tar.gz restflow rf
          mv restflow-${{ matrix.target }}.tar.gz ../../../

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          @"
          @echo off
          "%~dp0restflow.exe" %*
          "@ | Set-Content -NoNewline rf.cmd
          7z a restflow-${{ matrix.target }}.zip restflow.exe rf.cmd
          mv restflow-${{ matrix.target }}.zip ../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: restflow-${{ matrix.target }}
          path: restflow-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/cli-v}" >> $GITHUB_OUTPUT

      - name: Trigger Homebrew tap update
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: lhwzds/homebrew-tap
          event-type: update-formula
          client-payload: '{"version": "${{ steps.version.outputs.VERSION }}"}'

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/cli-v}" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          cd npm
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

      - name: Publish to npm with provenance (OIDC)
        run: |
          unset NODE_AUTH_TOKEN
          unset NPM_CONFIG_USERCONFIG
          cd npm
          npm publish --provenance --access public
