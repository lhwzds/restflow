name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Security audit
  security-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force || true

      - name: Check for security vulnerabilities
        run: cargo audit

  # Clippy for each crate (parallel)
  clippy:
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_DIR: /home/runner/.cargo-targets/restflow
    strategy:
      fail-fast: false
      matrix:
        crate:
          - types
          - llm
          - restflow-core
          - agent
          - tools
          - runner
          - daemon
          - tui
          - cli

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo-targets/restflow
          key: ${{ runner.os }}-clippy-${{ matrix.crate }}-${{ hashFiles('Cargo.lock') }}

      - name: Run Clippy on ${{ matrix.crate }}
        run: cargo clippy --package ${{ matrix.crate }} --all-targets -- -D warnings

  # Tests for each crate (parallel)
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /home/runner/.cargo-targets/restflow
    strategy:
      fail-fast: false
      matrix:
        crate:
          - types
          - llm
          - restflow-core
          - agent
          - tools
          - runner
          - daemon
          - tui
          - cli

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo-targets/restflow
          key: ${{ runner.os }}-test-${{ matrix.crate }}-${{ hashFiles('Cargo.lock') }}

      - name: Run tests for ${{ matrix.crate }}
        run: cargo test --package ${{ matrix.crate }} --verbose

  # Full local parity check, including the TUI PTY smoke.
  full-make-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: /home/runner/.cargo-targets/restflow
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo-targets/restflow
          key: ${{ runner.os }}-make-test-${{ hashFiles('Cargo.lock') }}

      - name: Run make test
        run: make test

  # npm package installer tests
  npm-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test npm installer package
        run: |
          cd npm
          npm test
          npm pack --dry-run

  # Build release binaries (multi-platform)
  build:
    needs: [clippy, test, full-make-test, npm-package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Configure Windows build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
          echo "CARGO_BUILD_JOBS=1" >> $GITHUB_ENV
          echo "RUSTFLAGS=-C debuginfo=0 -C link-arg=/DEBUG:NONE" >> $GITHUB_ENV

      - name: Build restflow
        run: cargo build --release --package cli --target ${{ matrix.target }}

      - name: Verify CLI alias
        shell: bash
        run: |
          release_dir="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            "$release_dir/restflow.exe" --version
            cat > "$release_dir/rf.cmd" <<'EOF'
          @echo off
          "%~dp0restflow.exe" %*
          EOF
            "$release_dir/rf.cmd" --version
          else
            "$release_dir/restflow" --version
            ln -sfn restflow "$release_dir/rf"
            "$release_dir/rf" --version
          fi
